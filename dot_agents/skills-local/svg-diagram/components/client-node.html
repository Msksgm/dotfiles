<!--
  部品テンプレート: クライアント（ブラウザ）ノード
  ------------------------------------------------
  用途:
    - 通信フロー図の「クライアント」を表すアイコン。単体の <g> として自己完結。
  貼り付け方:
    - <g class="wsdb-client"> ... </g> の内容をコピーし、外側に
      <g transform="translate(X,Y)"> ... </g> を被せて好きな座標に配置する。
    - ラベル文字列（「クライアント」「browser」）は用途に応じて書き換えてよい。
  依存 defs:
    - なし（単体で完結）
  ダークテーマ:
    - <style> 内の CSS 変数を .wsdb-client クラスへスコープし、
      @media (prefers-color-scheme: dark) で再定義して追従させる
  複数貼り付け時の注意:
    - id を持たないため、同一ページに複数貼っても衝突しない
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>部品: クライアントノード</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef1f6;
    font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0b0f16; }
  }
</style>
</head>
<body>

<svg viewBox="0 0 200 160" width="300" height="240" role="img" aria-label="クライアント（ブラウザ）ノード">
  <style>
    .wsdb-client {
      --ink: #161c28;
      --muted: #5c6b7d;
      --surface: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      .wsdb-client {
        --ink: #e9eef6;
        --muted: #7c8898;
        --surface: #131a24;
      }
    }
    .wsdb-client .frame { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }
    .wsdb-client .screen { fill: none; stroke: var(--muted); stroke-width: 1.3; }
    .wsdb-client .stand { stroke: var(--ink); stroke-width: 1.6; }
    .wsdb-client .label { font-size: 13px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
    .wsdb-client .sublabel {
      font-size: 10.5px; fill: var(--muted); text-anchor: middle;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
  </style>

  <g class="wsdb-client" transform="translate(57,40)">
    <rect class="frame" x="0" y="0" width="86" height="60" rx="8" />
    <rect class="screen" x="8" y="8" width="70" height="38" rx="3" />
    <rect class="frame" x="30" y="60" width="26" height="8" />
    <line class="stand" x1="24" y1="68" x2="62" y2="68" />
    <text class="label" x="43" y="94">クライアント</text>
    <text class="sublabel" x="43" y="108">browser</text>
  </g>
</svg>

</body>
</html>
