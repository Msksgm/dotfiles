<!--
  部品テンプレート: Webサーバーノード
  ------------------------------------------------
  用途:
    - 通信フロー図の「Webサーバー」を表すアイコン。ラック風のボックス + LED点滅 +
      パルスリング（リクエスト受信時のような明滅）を内包する自己完結の <g>。
  貼り付け方:
    - <g class="wsdb-server"> ... </g> をコピーし、外側に
      <g transform="translate(X,Y)"> ... </g> を被せて配置する。
    - パルスリングの色（既定は request 色の青）は用途に応じて変更してよい。
  依存 defs:
    - なし（単体で完結。アニメーションは <animate> のみで id 参照なし）
  ダークテーマ:
    - .wsdb-server クラスへスコープした CSS 変数を
      @media (prefers-color-scheme: dark) で再定義して追従させる
  複数貼り付け時の注意:
    - id を持たないため、同一ページに複数貼っても衝突しない
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>部品: Webサーバーノード</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef1f6;
    font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0b0f16; }
  }
</style>
</head>
<body>

<svg viewBox="0 0 220 200" width="330" height="300" role="img" aria-label="Webサーバーノード">
  <style>
    .wsdb-server {
      --ink: #161c28;
      --muted: #5c6b7d;
      --surface: #ffffff;
      --accent: #2f5fd6;
    }
    @media (prefers-color-scheme: dark) {
      .wsdb-server {
        --ink: #e9eef6;
        --muted: #7c8898;
        --surface: #131a24;
        --accent: #4da3ff;
      }
    }
    .wsdb-server .frame { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }
    .wsdb-server .slot { stroke: var(--muted); stroke-width: 1.2; }
    .wsdb-server .led { fill: var(--accent); }
    .wsdb-server .pulse { fill: none; stroke: var(--accent); stroke-width: 1.5; }
    .wsdb-server .label { font-size: 13px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
    .wsdb-server .sublabel {
      font-size: 10.5px; fill: var(--muted); text-anchor: middle;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
  </style>

  <g class="wsdb-server" transform="translate(30,30)">
    <rect class="frame" x="0" y="0" width="160" height="90" rx="10" />
    <line class="slot" x1="14" y1="22" x2="146" y2="22" />
    <line class="slot" x1="14" y1="45" x2="146" y2="45" />
    <line class="slot" x1="14" y1="68" x2="146" y2="68" />

    <circle class="led" cx="134" cy="22" r="3">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle class="led" cx="134" cy="45" r="3">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" begin="0.3s" repeatCount="indefinite" />
    </circle>
    <circle class="led" cx="134" cy="68" r="3">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" begin="0.6s" repeatCount="indefinite" />
    </circle>

    <circle class="pulse" cx="80" cy="45" r="46" opacity="0">
      <animate attributeName="r" values="30;62" dur="1.9s" begin="1.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0" dur="1.9s" begin="1.1s" repeatCount="indefinite" />
    </circle>

    <text class="label" x="80" y="112">Webサーバー</text>
    <text class="sublabel" x="80" y="126">app server</text>
  </g>
</svg>

</body>
</html>
