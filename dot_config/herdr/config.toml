# tmux (dot_tmux.conf) のキーバインドに合わせた herdr 設定。
# herdr は tmux 風の prefix を持つエージェントマルチプレクサ。
# 対応: pane→pane / tmux window→herdr tab / tmux session→herdr workspace。
# `herdr config check` で検証可能。`herdr --default-config` で全項目とデフォルト値を確認できる。

[keys]
# prefix — tmux: set -g prefix C-j
prefix = "ctrl+j"

# ペイン移動（vim キー） — tmux: bind h/j/k/l select-pane（herdr default と一致）
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# 分割 — tmux: bind | split-window -h / bind - split-window -v
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

# タブ移動 — tmux の next-window/previous-window（prefix+n / prefix+p、tmux 標準）に対応。
# herdr default とも一致する。
previous_tab = "prefix+p"
next_tab = "prefix+n"

# workspace 切替 — tmux: prefix+w（choose-tree でセッション/ウィンドウ一覧）と対応。
# prefix+w で workspace セレクタ（navigate mode）を開く（herdr default と一致）。
# セレクタ内の上下移動はデフォルト up/down だが、tmux choose-tree の vi 風移動に合わせて
# navigate mode 専用キー（prefix 不要の素の j/k）を割当。
workspace_picker = "prefix+w"
navigate_workspace_up = "k"
navigate_workspace_down = "j"

# agent 移動 — herdr の agents は独立タブでなくサイドバーの agent パネル。
# workspace のような navigate mode（j/k 連打）は agent には存在しない
# （navigate mode の方向キーは workspace 選択と pane フォーカスのみ）。
# 代替として prefix 前提の 1 ショットで割当。prefix+j/k は focus_pane_down/up が
# 占有するため衝突を避け、agent の a を基点にした prefix+a 系を使う。
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_agent = "prefix+ctrl+a"

# デタッチ — tmux: prefix d（herdr default は prefix+q。prefix+d は空きで close_workspace=shift+d と非衝突）
detach = "prefix+d"

# workspace を git リポジトリ名にリネーム — tmux: bind R（下記スクリプト）。
# tmux のリネームは R だが herdr では prefix+r=resize_mode / prefix+shift+r=reload_config が占有するため、
# 空きキー prefix+Space に割当。resize_mode・reload_config は herdr default を温存する。
[[keys.command]]
key = "prefix+space"
type = "shell"
command = "$HOME/.config/herdr/rename-workspace.sh"
description = "rename workspace to git repo name"

# 以下は tmux と 1:1 対応できないため herdr default のまま:
#   - リサイズ: tmux は H/J/K/L のワンショット、herdr は resize_mode(prefix+r)。
#   - レイアウト循環: tmux prefix+Space(next-layout) は herdr に該当機能なし（分割タイリングのみ）。
#   - copy mode: herdr 0.7.5 では [keys] の再マップ対象外（コピーモード内の vi 風 v/y は既定で tmux 同様）。

# テーマ設定。herdr がアプリ内でのテーマ変更時に home 側 config へ書き込むため、
# source に取り込んでおかないと apply のたびに削除される（ドリフト防止）。
[theme]
name = "catppuccin"
auto_switch = false

# 通知設定。
# バックグラウンド workspace のエージェントが状態変化した際に、
# OS の通知サービス（macOS 通知センター）へポップアップし、ビープ音を鳴らす。
# herdr は初回起動時に通知設定を home 側 config へ書き込むことがあるため、
# theme と同様 source に明示して drift を防ぐ。
[ui.toast]
# 配信先: off=無効 / herdr=アプリ内トースト / terminal=外側端末経由 / system=OS 通知サービス
delivery = "system"

# ビープ音（herdr 同梱のデフォルト通知音）を再生する。
# サウンドはバックグラウンド workspace のエージェント状態変化時のみ鳴る
# （アクティブタブの通知は herdr が自動抑制する）。
# enabled=true は herdr default だが、意図を source に明示して残す。
[ui.sound]
enabled = true
